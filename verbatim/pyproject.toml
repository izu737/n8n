[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verbatim"
version = "0.1.0"
description = "Video in, accurate speaker labelled transcript out. One job, done well."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "soundfile>=0.12"]

[project.scripts]
verbatim = "verbatim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verbatim = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
